[package]
name = "haunt"
version = "0.4.4"
edition = "2024"
repository = "https://github.com/scottmckendry/haunt"

[dependencies]
anyhow = "1"
crossterm = "0.29"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", features = [
  "pkg-config",
  "png",
] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
toml = { version = "1", features = ["preserve_order"] }

[profile.dist]
inherits = "release"
lto = "thin"
