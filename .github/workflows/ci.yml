name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, lint, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Cache Cargo and Zig artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features

      - name: Release build
        run: cargo build --locked --release

  release-please:
    name: Release Please
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-artifacts:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha || needs.release-please.outputs.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Cache Cargo and Zig artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh

      - name: Build artifacts
        run: |
          dist build --tag "$TAG" \
            --artifacts=local \
            --target=${{ matrix.target }} \
            --print=linkage \
            --output-format=json > dist-manifest.json
          cp dist-manifest.json \
            target/distrib/${{ matrix.target }}-dist-manifest.json

      - name: Upload local artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
            target/distrib/*-dist-manifest.json

  release:
    name: Build installers and publish release
    needs:
      - release-please
      - build-artifacts
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha || needs.release-please.outputs.tag_name }}

      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh

      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-build-local-*
          path: target/distrib
          merge-multiple: true

      - name: Build installers and checksums
        run: |
          dist build --tag "$TAG" \
            --artifacts=global \
            --output-format=json > global-dist-manifest.json
          cp global-dist-manifest.json \
            target/distrib/global-dist-manifest.json

      - name: Upload artifacts to GitHub Release
        run: |
          mapfile -t files < <(
            for manifest in target/distrib/*-dist-manifest.json; do
              dist print-upload-files-from-manifest --manifest "$manifest"
            done | while IFS= read -r file; do
              if [[ -f "$file" ]]; then
                printf '%s\n' "$file"
              elif [[ -f "target/distrib/$(basename "$file")" ]]; then
                printf '%s\n' "target/distrib/$(basename "$file")"
              fi
            done | sort -u
          )
          gh release upload "$TAG" --clobber "${files[@]}"
